<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Backoffice Blue-Axis</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  
  <link rel="stylesheet" href="/css/tailwind.css" />
  <link rel="stylesheet" href="/css/style.css" />

  <style>
    body { 
      font-family: 'Manrope', sans-serif; 
      background-image: url('/assets/images/porto hero.png'); 
      background-size: cover; 
      background-position: center; 
    }
    .overlay { background-color: rgba(0, 52, 91, 0.85); position: absolute; inset: 0; }
  </style>
</head>
<body class="relative h-screen flex items-center justify-center">
  <div class="overlay"></div>

  <div class="relative z-10 bg-white p-10 rounded-[25px] shadow-2xl w-full max-w-md border border-gray-100">
    <div class="text-center mb-8">
      <img src="/assets/logo/LOGO%20BLUE%20HORIZON%202.png" alt="BLUE HORIZON" class="h-12 mx-auto mb-4" />
      <h2 class="text-2xl font-bold text-primary">Backoffice</h2>
      <p class="text-sm text-gray-500 mt-1">Acesso administrativo</p>
    </div>
    
    <form id="loginForm" class="space-y-5">
      <div>
        <label for="email" class="block text-sm font-semibold text-gray-700 mb-1">E-mail corporativo</label>
        <input type="email" id="email" required class="block w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-primary focus:bg-white transition-colors">
      </div>
      
      <div>
        <label for="senha" class="block text-sm font-semibold text-gray-700 mb-1">Senha</label>
        <input type="password" id="senha" required class="block w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-primary focus:bg-white transition-colors">
      </div>

      <div id="erroMensagem" class="text-error bg-error-container/20 px-4 py-2 rounded-lg text-sm font-medium hidden"></div>

      <button type="submit" class="w-full flex justify-center py-3 px-4 rounded-[25px] text-sm font-bold text-white bg-primary hover:bg-primary-container transition-colors duration-200 shadow-md active:scale-95">
        Entrar no Sistema
      </button>
    </form>
  </div>

  <script src=".././js/backoffice-login.js"></script>
</body>
</html>
